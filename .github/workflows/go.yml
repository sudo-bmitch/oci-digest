name: Go

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*', 'v*.*.*-rc*' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: read

jobs:

  build:
    name: Test and Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        gover: ['go.mod', 'oldstable', 'stable']

    env:
      # do not automatically upgrade go to a different version: https://go.dev/doc/toolchain
      GOTOOLCHAIN: "local"

    steps:
    - name: Check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: "Set up Go ${{ matrix.gover }}"
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.gover != 'go.mod' && matrix.gover || null }}
        go-version-file: ${{ matrix.gover == 'go.mod' && 'go.mod' || null }}
        check-latest: true
      id: go

    - name: Verify go fmt
      run: test -z "$(go fmt ./...)"

    - name: Verify go vet
      run: test -z "$(go vet ./...)"

    - name: Test
      run: make test

    - name: Linting
      if: matrix.gover == 'stable'
      run: make lint
